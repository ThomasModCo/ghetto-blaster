<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toy Reskin Asset Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* one visual world: the game's own molded-plastic UI. Gunmetal panels, cobalt rim, gold for highlights.
     Layout: sticky toolbar, then a dense grid of compare cards; a lightbox for the big view. */
  --bg: #101216; --panel: #1d2027; --panel-hi: #2b3039; --ink: #090b0f; --rim: #4f80f0;
  --cobalt: #2f66db; --gold: #ffd95e; --text: #eef0f4; --muted: #a3abbb; --studio: #c9c2b8; --studio-lo: #a59d91;
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif; --body: 'Barlow', 'Segoe UI', Roboto, Helvetica, sans-serif;
  --stroke: 0 2px 0 var(--ink), 1px 1px 0 var(--ink), -1px 1px 0 var(--ink), 1px -1px 0 var(--ink), -1px -1px 0 var(--ink);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body { background: radial-gradient(1200px 500px at 50% -120px, rgba(47, 102, 219, 0.22), transparent 70%), var(--bg); min-height: 100%; }
img { max-width: 100%; display: block; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

header { padding: 28px max(16px, 4vw) 12px; display: grid; gap: 10px; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 4.4vw, 52px); letter-spacing: 0.03em; line-height: 1; text-shadow: var(--stroke); text-wrap: balance; }
h1 em { font-style: normal; color: var(--rim); }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.tally span { background: var(--panel); border: 1px solid #2c313b; border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tally b { color: var(--text); font-weight: 600; }

.bar { position: sticky; top: 0; z-index: 5; padding: 10px max(16px, 4vw); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: linear-gradient(180deg, rgba(16, 18, 22, 0.97), rgba(16, 18, 22, 0.9)); border-bottom: 2px solid var(--ink); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05); backdrop-filter: blur(6px); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 520px; }
.chip { cursor: pointer; border: 2px solid var(--ink); border-radius: 9px; padding: 4px 11px; background: linear-gradient(180deg, var(--panel-hi), var(--panel)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1); font-weight: 600; font-size: 13px; letter-spacing: 0.02em; }
.chip i { font-style: normal; color: var(--muted); font-weight: 500; margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: linear-gradient(180deg, #6d9bff, var(--cobalt) 55%, #1f47a8); box-shadow: 0 0 0 1px #9dbcff, inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.chip[aria-pressed="true"] i { color: #dbe6ff; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#q { width: 220px; max-width: 60vw; padding: 7px 12px; border-radius: 9px; border: 2px solid var(--ink); background: #0c0e12; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(79, 128, 240, 0.35); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 9px; overflow: hidden; }
.seg button { cursor: pointer; border: 0; padding: 6px 12px; background: var(--panel); font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--cobalt); color: #fff; }

main { padding: 18px max(16px, 4vw) 60px; display: grid; gap: 28px; }
section h2 { margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: 0.04em; text-shadow: var(--stroke); display: flex; gap: 10px; align-items: baseline; }
section h2 small { font-family: var(--body); font-size: 13px; color: var(--muted); letter-spacing: 0; text-shadow: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
.card { background: linear-gradient(180deg, #252a32, #181b21); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 0 0 1px rgba(79, 128, 240, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.07); overflow: hidden; display: flex; flex-direction: column; }
.meta { padding: 9px 12px 11px; display: grid; gap: 3px; }
.meta .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.meta button.name { all: unset; cursor: pointer; font-weight: 700; font-size: 15px; }
.meta button.name:hover { color: var(--gold); }
.meta button.name:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
.meta code { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
.kind { justify-self: start; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--ink); background: #2a3550; color: #c9d7ff; }
.kind.gen { background: #20406f; color: #d6e4ff; }
.kind.new { background: #6a5410; color: var(--gold); }
.kind.kept { background: #33363d; color: var(--muted); }

/* compare: the after image underneath, the before image clipped to the left of the handle */
.cmp { position: relative; aspect-ratio: 4 / 3; background: radial-gradient(ellipse at 50% 40%, var(--studio), var(--studio-lo)); touch-action: pan-y; user-select: none; cursor: ew-resize; --pos: 50%; }
.cmp.dark { background: radial-gradient(ellipse at 50% 40%, #2a2f38, #121418); }
.cmp.wide { aspect-ratio: 16 / 9; }
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
.cmp.fill img { object-fit: cover; }
.cmp .before { clip-path: inset(0 calc(100% - var(--pos)) 0 0); background: inherit; } /* opaque: the after render must not show through the before render's transparent areas */
.cmp .handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 0; }
.cmp .handle::before { content: ''; position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px; background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
.cmp .handle::after { content: '◀ ▶'; position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%); font-size: 9px; letter-spacing: -1px; white-space: nowrap; padding: 6px 7px; border-radius: 999px; background: var(--cobalt); color: #fff; border: 2px solid var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5); }
.cmp .lbl { position: absolute; top: 8px; font-family: var(--display); font-size: 12px; letter-spacing: 0.08em; padding: 2px 8px; border-radius: 6px; border: 2px solid var(--ink); pointer-events: none; }
.cmp .lbl.b { left: 8px; background: #3b414c; color: #e6e8ec; }
.cmp .lbl.a { right: 8px; background: var(--cobalt); color: #fff; }
.cmp.solo { cursor: default; }
.cmp.solo .lbl.a { background: #6a5410; color: var(--gold); }
/* side by side */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--ink); }
.pair .cmp { cursor: default; }
.pair .cmp .before { clip-path: none; }

/* lightbox */
dialog { width: min(1180px, 96vw); max-height: 94vh; padding: 0; border: 2px solid var(--rim); border-radius: 16px; background: linear-gradient(180deg, #2b3039, #14161b); color: var(--text); box-shadow: 0 0 0 3px var(--ink), 0 30px 80px rgba(0, 0, 0, 0.7); overflow: auto; }
dialog::backdrop { background: rgba(4, 6, 10, 0.78); backdrop-filter: blur(3px); }
.lb-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 2px solid var(--ink); }
.lb-head h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: 0.04em; text-shadow: var(--stroke); }
.lb-nav { display: flex; gap: 6px; }
.btn { cursor: pointer; border: 2px solid var(--ink); border-radius: 9px; padding: 6px 12px; background: linear-gradient(180deg, var(--panel-hi), var(--panel)); font-weight: 600; box-shadow: 0 0 0 1px rgba(79, 128, 240, 0.4); }
.btn:hover { background: linear-gradient(180deg, #6d9bff, var(--cobalt) 55%, #1f47a8); }
.lb-body { display: grid; gap: 12px; padding: 14px 16px 18px; }
.lb-body .desc { color: var(--muted); max-width: 80ch; margin: 0; }
.lb-body .cmp { width: min(100%, calc(66vh * 4 / 3)); justify-self: center; }
.lb-body .cmp.wide { width: min(100%, calc(66vh * 16 / 9)); }
.hint { font-size: 12.5px; color: var(--muted); }
.empty { color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Ghetto Blaster <em>Toy Reskin</em> Asset Library</h1>
  <p class="lede">Every asset the game ships, rendered by the game's own catalog code from the original build and from the toy reskin. Drag the handle on a card to compare. Gameplay, colliders and sizes are unchanged; only the look is new.</p>
  <div class="tally" id="tally"></div>
</header>
<div class="bar">
  <div class="cats" id="cats" role="group" aria-label="Category"></div>
  <div class="tools">
    <label for="q" class="hint" style="position:absolute;left:-9999px">Search assets</label>
    <input id="q" type="search" placeholder="Search assets…" autocomplete="off">
    <div class="seg" role="group" aria-label="Compare view">
      <button id="v-slider" aria-pressed="true">Slider</button>
      <button id="v-side" aria-pressed="false">Side by side</button>
    </div>
  </div>
</div>
<main id="main"></main>
<dialog id="lb" aria-labelledby="lb-title">
  <div class="lb-head"><h3 id="lb-title"></h3><div class="lb-nav"><button class="btn" id="lb-prev" aria-label="Previous asset">◀ Prev</button><button class="btn" id="lb-next" aria-label="Next asset">Next ▶</button><button class="btn" id="lb-close">Close</button></div></div>
  <div class="lb-body" id="lb-body"></div>
</dialog>

bp","b":true,"k":"Cap-gun effects"},{"id":"vfx:explosion","n":"Explosion","c":"VFX","g":"Explosions","d":"Grenade / streak explosion: fireball sparks, smoke, flash sprite and a light.","f":"vfx_explosion.webp","b":true,"k":"Cap-gun effects"},{"id":"vfx:smoke","n":"Smoke grenade cloud","c":"VFX","g":"Explosions","d":"Smoke grenade cloud that blocks bot vision for 14 s.","f":"vfx_smoke.webp","b":true,"k":"Cap-gun effects"},{"id":"vfx:impact","n":"Bullet impact","c":"VFX","g":"Impacts","d":"Surface hit: debris particles and a dust puff.","f":"vfx_impact.webp","b":true,"k":"Cap-gun effects"},{"id":"vfx:blood","n":"Plastic chip hit","c":"VFX","g":"Impacts","d":"Player / bot hit: a spray of chips in the victim's plastic colour plus white stress flecks (toy reskin; replaces the blood splash).","f":"vfx_blood.webp","b":true,"k":"Cap-gun effects"},{"id":"icon:streak-reup","n":"RE-UP","c":"Icons","g":"Streak \u2014 starter","d":"Full ammo and equipment refill.","f":"icon_streak-reup.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-la_tent","n":"TENT CITY","c":"Icons","g":"Streak \u2014 starter","d":"The tents are watching. Enemies on radar for 30 s.","f":"icon_streak-la_tent.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-lookout","n":"LOOKOUT","c":"Icons","g":"Streak \u2014 starter","d":"Homie on the roof calls out enemy positions on your map for 25 s.","f":"icon_streak-lookout.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-vest","n":"VEST","c":"Icons","g":"Streak \u2014 starter","d":"Strap on a vest: +75 armor until it breaks.","f":"icon_streak-vest.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-jammer","n":"JAMMER","c":"Icons","g":"Streak \u2014 starter","d":"Scrambles enemy radar for 25 s and hides your crew.","f":"icon_streak-jammer.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-pitbull","n":"PITBULL","c":"Icons","g":"Streak \u2014 medium","d":"Release a pitbull that hunts the nearest enemy for 40 s.","f":"icon_streak-pitbull.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-firecrackers","n":"FIRECRACKERS","c":"Icons","g":"Streak \u2014 medium","d":"Explosions rain on random enemies for 15 s.","f":"icon_streak-firecrackers.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-homies","n":"CALL THE HOMIES","c":"Icons","g":"Streak \u2014 medium","d":"Two of your crew pull up and fight with you for 45 s.","f":"icon_streak-homies.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-la_lapd","n":"LAPD SWEEP","c":"Icons","g":"Streak \u2014 medium","d":"Two patrol cops roll in and clear the block with you for 40 s.","f":"icon_streak-la_lapd.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-driveby","n":"DRIVE-BY","c":"Icons","g":"Streak \u2014 medium","d":"A car rolls through where you are aiming, spraying everything on the way.","f":"icon_streak-driveby.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-hitman","n":"HITMAN","c":"Icons","g":"Streak \u2014 powerful","d":"A contract killer drops one enemy every 4 s for 20 s.","f":"icon_streak-hitman.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ghettobird","n":"GHETTO BIRD","c":"Icons","g":"Streak \u2014 powerful","d":"A chopper circles the block gunning enemies for 30 s.","f":"icon_streak-ghettobird.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-traphouse","n":"TRAP HOUSE ARMOR","c":"Icons","g":"Streak \u2014 powerful","d":"300 health plate carrier for 60 s. You move slower.","f":"icon_streak-traphouse.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-la_quake","n":"SHAKE","c":"Icons","g":"Streak \u2014 powerful","d":"An earthquake knocks every enemy off their feet for 6 s. Free kills.","f":"icon_streak-la_quake.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-riot","n":"RIOT","c":"Icons","g":"Streak \u2014 powerful","d":"The whole block riots. Every enemy currently alive goes down.","f":"icon_streak-riot.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ny_stoop","n":"STOOP WATCH","c":"Icons","g":"Streak \u2014 starter","d":"The stoop sees everything. Enemies on radar for 30 s.","f":"icon_streak-ny_stoop.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ny_train","n":"RUSH HOUR","c":"Icons","g":"Streak \u2014 medium","d":"Shockwaves from the passing train knock down enemies around the tracks.","f":"icon_streak-ny_train.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ny_nypd","n":"NYPD RAID","c":"Icons","g":"Streak \u2014 powerful","d":"Three NYPD officers storm the block on your side for 45 s.","f":"icon_streak-ny_nypd.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-chi_wire","n":"THE WIRE","c":"Icons","g":"Streak \u2014 starter","d":"Tapped phones: the closest enemy is pinged every 2 s for 25 s.","f":"icon_streak-chi_wire.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-chi_hawk","n":"THE HAWK","c":"Icons","g":"Streak \u2014 medium","d":"A lake-effect wind cuts visibility and accuracy for every enemy for 25 s.","f":"icon_streak-chi_hawk.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-chi_outfit","n":"THE OUTFIT","c":"Icons","g":"Streak \u2014 powerful","d":"Outfit shooters drop an enemy every 4 s for 24 s.","f":"icon_streak-chi_outfit.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-nola_brass","n":"BRASS BAND","c":"Icons","g":"Streak \u2014 starter","d":"A second line draws every enemy toward your decoy for 20 s.","f":"icon_streak-nola_brass.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-nola_flood","n":"FLOODWALL","c":"Icons","g":"Streak \u2014 medium","d":"+150 armor. The levee holds.","f":"icon_streak-nola_flood.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-nola_gator","n":"GATOR SEASON","c":"Icons","g":"Streak \u2014 powerful","d":"Two gators run the streets hunting enemies for 50 s.","f":"icon_streak-nola_gator.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ccs_moto","n":"MOTO TAXI","c":"Icons","g":"Streak \u2014 starter","d":"Ride the moto: 25% faster for 20 s.","f":"icon_streak-ccs_moto.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ccs_colectivo","n":"COLECTIVO","c":"Icons","g":"Streak \u2014 medium","d":"Three colectivos on bikes roll up on your side for 40 s.","f":"icon_streak-ccs_colectivo.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-ccs_apagon","n":"APAG\u00d3N","c":"Icons","g":"Streak \u2014 powerful","d":"Blackout hits the hill: enemy radar dead and enemies blind for 35 s.","f":"icon_streak-ccs_apagon.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-hk_triad","n":"TRIAD EYES","c":"Icons","g":"Streak \u2014 starter","d":"Every shop owner reports in. Enemies on radar for 30 s.","f":"icon_streak-hk_triad.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-hk_fireworks","n":"FIREWORKS","c":"Icons","g":"Streak \u2014 medium","d":"New Year fireworks go off on enemy heads for 15 s.","f":"icon_streak-hk_fireworks.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-hk_dragon","n":"DRAGON DANCE","c":"Icons","g":"Streak \u2014 powerful","d":"The dragon runs through the alleys. Every enemy alive goes down 3 s after you call it.","f":"icon_streak-hk_dragon.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-par_rer","n":"RER DELAY","c":"Icons","g":"Streak \u2014 starter","d":"Strike day: enemy radar is useless for 30 s.","f":"icon_streak-par_rer.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-par_crs","n":"CRS CHARGE","c":"Icons","g":"Streak \u2014 medium","d":"Three riot cops charge in on your side for 40 s.","f":"icon_streak-par_crs.webp","b":true,"k":"Plastic token"},{"id":"icon:streak-par_emeute","n":"\u00c9MEUTE","c":"Icons","g":"Streak \u2014 powerful","d":"The cit\u00e9 riots: cars burn and every enemy is knocked down for 7 s.","f":"icon_streak-par_emeute.webp","b":true,"k":"Plastic token"}];
const ORDER = ['Screens', 'Characters', 'Weapons', 'Equipment', 'Props', 'Structures', 'Maps', 'Textures', 'VFX', 'Icons'];
const BLURB = {
  Screens: 'Menus and HUD: same layout, molded-plastic look.',
  Characters: 'Box rigs became generated plastic figures; the streak units are new.',
  Weapons: 'Procedural box guns became generated plastic toy guns.',
  Equipment: 'Throwables and gadgets, restyled in molded plastic.',
  Props: 'Street furniture and clutter: most are now generated models baked into one shared texture.',
  Structures: 'Buildings and shells: procedural playset kit with miniature-painted facades.',
  Maps: 'Whole dioramas, same layout and colliders.',
  Textures: 'Painted the way model-railroad scenery is painted.',
  VFX: 'Muzzle flashes and smoke became cap-gun pops.',
  Icons: 'Streak and HUD icons.',
};
const DARK = new Set(['Icons', 'VFX']), FILL = new Set(['Maps', 'Textures', 'Screens']);
const slug = (id) => id.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const src = (it, side) => (it.ui ? `ui/${side}-${it.f}.webp` : `${side}/${it.f}`);
const kindClass = (it) => (!it.b ? 'new' : /^Generated/.test(it.k) ? 'gen' : /^Procedural/.test(it.k) ? 'kept' : '');
let cat = 'All', q = '', mode = 'slider', open = null;

function cmpHTML(it, big) {
  const cls = ['cmp', DARK.has(it.c) ? 'dark' : '', FILL.has(it.c) ? 'fill' : '', it.ui || it.c === 'Maps' ? 'wide' : ''].join(' ');
  const alt = esc(it.n);
  if (!it.b) return `<div class="${cls} solo"><img src="${src(it, 'a')}" alt="${alt}, reskin" loading="lazy"><span class="lbl a">NEW</span></div>`;
  if (mode === 'side' && !big) return `<div class="pair"><div class="${cls}"><img class="before" src="${src(it, 'b')}" alt="${alt}, original" loading="lazy"><span class="lbl b">BEFORE</span></div><div class="${cls}"><img src="${src(it, 'a')}" alt="${alt}, reskin" loading="lazy"><span class="lbl a">AFTER</span></div></div>`;
  return `<div class="${cls}" tabindex="0" role="slider" aria-label="${alt}: before and after" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><img src="${src(it, 'a')}" alt="${alt}, reskin" loading="lazy"><img class="before" src="${src(it, 'b')}" alt="${alt}, original" loading="lazy"><div class="handle"></div><span class="lbl b">BEFORE</span><span class="lbl a">AFTER</span></div>`;
}
function card(it) {
  return `<article class="card">${cmpHTML(it)}<div class="meta"><div class="t"><button class="name" data-open="${esc(it.id)}">${esc(it.n)}</button><code>${esc(it.id)}</code></div><span class="kind ${kindClass(it)}">${!it.b ? 'New: ' : ''}${esc(it.k)}</span></div></article>`;
}
function visible() {
  const s = q.trim().toLowerCase();
  return ITEMS.filter((it) => (cat === 'All' || it.c === cat) && (!s || (it.n + ' ' + it.id + ' ' + it.g + ' ' + it.k).toLowerCase().includes(s)));
}
function render() {
  const list = visible(), main = document.getElementById('main');
  if (!list.length) { main.innerHTML = '<p class="empty">No assets match that search.</p>'; return; }
  main.innerHTML = ORDER.filter((c) => list.some((it) => it.c === c)).map((c) => {
    const its = list.filter((it) => it.c === c);
    return `<section id="sec-${slug(c)}"><h2>${esc(c)} <small>${its.length} · ${esc(BLURB[c] || '')}</small></h2><div class="grid ${c === 'Screens' || c === 'Maps' ? 'wide' : ''}">${its.map(card).join('')}</div></section>`;
  }).join('');
}
function renderCats() {
  const counts = {}; for (const it of ITEMS) counts[it.c] = (counts[it.c] || 0) + 1;
  document.getElementById('cats').innerHTML = ['All', ...ORDER].map((c) => `<button class="chip" data-cat="${c}" aria-pressed="${c === cat}">${c}<i>${c === 'All' ? ITEMS.length : counts[c] || 0}</i></button>`).join('');
}
function renderTally() {
  const gen = ITEMS.filter((it) => /^Generated/.test(it.k)).length, fresh = ITEMS.filter((it) => !it.b).length, pairs = ITEMS.filter((it) => it.b).length;
  document.getElementById('tally').innerHTML = `<span><b>${ITEMS.length}</b> assets</span><span><b>${pairs}</b> before and after</span><span><b>${gen}</b> generated 3D models</span><span><b>${fresh}</b> new in the reskin</span><span><b>7</b> maps, colliders unchanged</span>`;
}

// drag to compare (pointer, and arrow keys when a slider has focus)
function setPos(el, pct) { pct = Math.max(0, Math.min(100, pct)); el.style.setProperty('--pos', pct + '%'); el.setAttribute('aria-valuenow', Math.round(pct)); }
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.cmp[role="slider"]'); if (!el) return;
  const move = (ev) => { const r = el.getBoundingClientRect(); setPos(el, ((ev.clientX - r.left) / r.width) * 100); };
  move(e); el.setPointerCapture(e.pointerId);
  el.onpointermove = move; el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
});
document.addEventListener('keydown', (e) => {
  const el = document.activeElement;
  if (el && el.matches('.cmp[role="slider"]') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); setPos(el, +el.getAttribute('aria-valuenow') + (e.key === 'ArrowLeft' ? -5 : 5)); return; }
  const lb = document.getElementById('lb');
  if (lb.open && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !(el && el.matches('.cmp'))) { e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1); }
});

// lightbox
function openItem(id) {
  const it = ITEMS.find((x) => x.id === id); if (!it) return; open = it;
  document.getElementById('lb-title').textContent = it.n;
  document.getElementById('lb-body').innerHTML = `${cmpHTML(it, true)}<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="kind ${kindClass(it)}">${!it.b ? 'New: ' : ''}${esc(it.k)}</span><span class="hint">${esc(it.c)} · ${esc(it.g)} · <code>${esc(it.id)}</code></span></div>${it.d ? `<p class="desc">${esc(it.d)}</p>` : ''}<p class="hint">Drag the handle, or focus the image and use the arrow keys. Arrow keys elsewhere step through assets.</p>`;
  const lb = document.getElementById('lb'); if (!lb.open) lb.showModal();
  if (location.hash !== '#a-' + slug(it.id)) history.replaceState(null, '', '#a-' + slug(it.id));
}
function step(d) { const list = visible(); const i = list.indexOf(open); const n = list[(i + d + list.length) % list.length]; if (n) openItem(n.id); }
function closeLb() { const lb = document.getElementById('lb'); if (lb.open) lb.close(); }
document.getElementById('lb').addEventListener('close', () => { open = null; history.replaceState(null, '', cat === 'All' ? location.pathname : '#' + slug(cat)); });
document.getElementById('lb').addEventListener('click', (e) => { if (e.target.id === 'lb') closeLb(); });
document.getElementById('lb-close').onclick = closeLb;
document.getElementById('lb-prev').onclick = () => step(-1);
document.getElementById('lb-next').onclick = () => step(1);

document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-cat]'); if (c) { cat = c.dataset.cat; renderCats(); render(); history.replaceState(null, '', cat === 'All' ? location.pathname : '#' + slug(cat)); return; }
  const o = e.target.closest('[data-open]'); if (o) openItem(o.dataset.open);
});
document.getElementById('q').addEventListener('input', (e) => { q = e.target.value; render(); });
for (const [id, m] of [['v-slider', 'slider'], ['v-side', 'side']]) document.getElementById(id).onclick = () => { mode = m; document.getElementById('v-slider').setAttribute('aria-pressed', m === 'slider'); document.getElementById('v-side').setAttribute('aria-pressed', m === 'side'); render(); };

function fromHash() {
  const h = location.hash.slice(1);
  if (h.startsWith('a-')) { const it = ITEMS.find((x) => 'a-' + slug(x.id) === h); if (it) { openItem(it.id); return; } }
  const c = ['All', ...ORDER].find((x) => slug(x) === h); cat = c || 'All'; closeLb(); renderCats(); render();
}
window.addEventListener('hashchange', fromHash);
renderTally(); fromHash();
</script>
</body>
</html>
